<!DOCTYPE html>
<html>
<head>
    <title>Depth Wizard - Terrain Viewer</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; }
        #controls { position: absolute; top: 10px; left: 10px; z-index: 10; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="controls">
        <div>
            <label style="font-size:0.9em;">Regular photo (relative height only):</label><br>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div style="margin-top:8px;">
            <label style="font-size:0.9em;">Georeferenced GeoTIFF (real elevation in meters):</label><br>
            <input type="file" id="geoFileInput" accept=".tif,.tiff">
        </div>
        <button id="modeToggle" style="display:none; margin-top:8px;">Enter First-Person Mode</button>
        <p id="status">Upload a satellite image to see its 3D terrain.</p>
        <p id="elevationInfo" style="display:none; font-size:0.9em; color:#8f8;"></p>
        <p id="hint" style="display:none; font-size:0.9em; color:#aaa;">WASD to move, mouse to look, Shift/Space for down/up, Esc to exit</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 0, 0);

        const flyControls = new THREE.PointerLockControls(camera, document.body);
        let flyMode = false;
        const moveState = { forward: false, back: false, left: false, right: false, up: false, down: false };
        const flySpeed = 6; // units per second
        let lastFrameTime = performance.now();

        const modeToggle = document.getElementById('modeToggle');
        const hint = document.getElementById('hint');

        modeToggle.addEventListener('click', () => {
            if (!flyMode) {
                flyControls.lock(); // browser will only allow this from a real user click, which this is
            } else {
                flyControls.unlock();
            }
        });

        flyControls.addEventListener('lock', () => {
            flyMode = true;
            orbitControls.enabled = false;
            modeToggle.textContent = 'Exit First-Person Mode';
            hint.style.display = 'block';
        });

        flyControls.addEventListener('unlock', () => {
            flyMode = false;
            orbitControls.enabled = true;
            modeToggle.textContent = 'Enter First-Person Mode';
            hint.style.display = 'none';
        });

        document.addEventListener('keydown', (e) => {
            if (!flyMode) return;
            if (e.code === 'KeyW') moveState.forward = true;
            if (e.code === 'KeyS') moveState.back = true;
            if (e.code === 'KeyA') moveState.left = true;
            if (e.code === 'KeyD') moveState.right = true;
            if (e.code === 'Space') moveState.up = true;
            if (e.code === 'ShiftLeft') moveState.down = true;
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveState.forward = false;
            if (e.code === 'KeyS') moveState.back = false;
            if (e.code === 'KeyA') moveState.left = false;
            if (e.code === 'KeyD') moveState.right = false;
            if (e.code === 'Space') moveState.up = false;
            if (e.code === 'ShiftLeft') moveState.down = false;
        });

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 5);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x888888));

        let terrainMesh = null;

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const delta = (now - lastFrameTime) / 1000;
            lastFrameTime = now;

            if (flyMode) {
                const moveDist = flySpeed * delta;
                if (moveState.forward) flyControls.moveForward(moveDist);
                if (moveState.back) flyControls.moveForward(-moveDist);
                if (moveState.right) flyControls.moveRight(moveDist);
                if (moveState.left) flyControls.moveRight(-moveDist);
                if (moveState.up) camera.position.y += moveDist;
                if (moveState.down) camera.position.y -= moveDist;
            } else {
                orbitControls.update();
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Read a File/Blob into pixel data via a hidden canvas ---
        function getImagePixels(imageUrl) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve({ img, data: ctx.getImageData(0, 0, img.width, img.height) });
                };
                img.src = imageUrl;
            });
        }

        // Sample the depth map at (x,y) with bilinear interpolation for smoother results
        // than just picking the single nearest pixel
        function sampleDepthSmooth(depthData, u, v) {
            const x = u * (depthData.width - 1);
            const y = v * (depthData.height - 1);
            const x0 = Math.floor(x), x1 = Math.min(x0 + 1, depthData.width - 1);
            const y0 = Math.floor(y), y1 = Math.min(y0 + 1, depthData.height - 1);
            const fx = x - x0, fy = y - y0;

            const getPixel = (px, py) => depthData.data[(py * depthData.width + px) * 4] / 255;
            const top = getPixel(x0, y0) * (1 - fx) + getPixel(x1, y0) * fx;
            const bottom = getPixel(x0, y1) * (1 - fx) + getPixel(x1, y1) * fx;
            return top * (1 - fy) + bottom * fy;
        }

        async function buildTerrain(originalUrl, depthUrl) {
            const status = document.getElementById('status');
            status.textContent = 'Building 3D terrain...';

            const { data: depthData } = await getImagePixels(depthUrl);
            // Higher resolution mesh - more detail, still fast enough for a browser
            const segmentsX = 200, segmentsY = 200;

            const geometry = new THREE.PlaneGeometry(10, 10, segmentsX - 1, segmentsY - 1);
            const position = geometry.attributes.position;

            // First pass: sample heights with bilinear interpolation (smoother than raw pixels)
            const heights = new Float32Array(position.count);
            const margin = 0.04; // skip the outer ~4% of the depth map, where tile-seam artifacts live
            for (let i = 0; i < position.count; i++) {
                const px = i % segmentsX;
                const py = Math.floor(i / segmentsX);
                const u = margin + (px / (segmentsX - 1)) * (1 - 2 * margin);
                const v = margin + (py / (segmentsY - 1)) * (1 - 2 * margin);
                heights[i] = sampleDepthSmooth(depthData, u, v);
            }

            // Second pass: light smoothing - average each point with its immediate neighbors
            // to soften sharp jumps (like tile-seam artifacts) without losing real shape
            const smoothed = new Float32Array(position.count);
            for (let py = 0; py < segmentsY; py++) {
                for (let px = 0; px < segmentsX; px++) {
                    const i = py * segmentsX + px;
                    let sum = heights[i], count = 1;
                    const neighbors = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (const [dx, dy] of neighbors) {
                        const nx = px + dx, ny = py + dy;
                        if (nx >= 0 && nx < segmentsX && ny >= 0 && ny < segmentsY) {
                            sum += heights[ny * segmentsX + nx];
                            count++;
                        }
                    }
                    smoothed[i] = sum / count;
                }
            }

            for (let i = 0; i < position.count; i++) {
                position.setZ(i, smoothed[i] * 2.5);
            }
            geometry.computeVertexNormals();

            const texture = new THREE.TextureLoader().load(originalUrl);
            const material = new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide });

            if (terrainMesh) scene.remove(terrainMesh);
            terrainMesh = new THREE.Mesh(geometry, material);
            terrainMesh.rotation.x = -Math.PI / 2;
            scene.add(terrainMesh);

            status.textContent = 'Done. Drag to orbit, scroll to zoom.';
            document.getElementById('modeToggle').style.display = 'inline-block';
            camera.position.set(0, 8, 12); // reset camera to a sensible starting point above the terrain
        }
    // --- Handle GeoTIFF upload: call the absolute-elevation endpoint ---
        document.getElementById('geoFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            const elevationInfo = document.getElementById('elevationInfo');
            status.textContent = 'Uploading GeoTIFF and computing real elevation (this takes a bit longer)...';
            elevationInfo.style.display = 'none';

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Get a browser-displayable PNG version of the GeoTIFF for use as the texture
                const previewResponse = await fetch('/geotiff-preview', {
                    method: 'POST',
                    body: formData
                });
                const previewBlob = await previewResponse.blob();
                const originalUrl = URL.createObjectURL(previewBlob);

                const response = await fetch('/predict-elevation-geotiff', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                // Real elevation values AND honest accuracy metrics, computed server-side
                const fitParams = response.headers.get('X-Fit-Params') || '';
                const elevMin = response.headers.get('X-Elevation-Min');
                const elevMax = response.headers.get('X-Elevation-Max');
                const rmse = response.headers.get('X-RMSE');
                const mae = response.headers.get('X-MAE');
                const correlation = response.headers.get('X-Correlation');
                const dsmBlob = await response.blob();

                elevationInfo.innerHTML =
                    `Real elevation range: ${elevMin}m to ${elevMax}m (fit: ${fitParams})<br>` +
                    `Validated against SRTM reference data (held-out test): RMSE ${rmse}m, MAE ${mae}m, correlation ${correlation}`;
                elevationInfo.style.display = 'block';

                // For the 3D view, we still need a depth-map-style image to build the mesh from -
                // reuse the same visual pipeline as the regular upload, since the DSM's actual
                // shape matches what /predict-depth would show for this same image, just rescaled.
                const depthResponse = await fetch('/predict-depth', {
                    method: 'POST',
                    body: formData
                });
                const depthBlob = await depthResponse.blob();
                const depthUrl = URL.createObjectURL(depthBlob);

                await buildTerrain(originalUrl, depthUrl);
                status.textContent = 'Done. This terrain has real elevation data attached (see above).';
            } catch (err) {
                status.textContent = 'Error: ' + err.message + ' (is the backend server running?)';
                console.error(err);
            }
        });

        // --- Handle file upload: call the backend, then build terrain from the result ---
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status');
            status.textContent = 'Uploading and running depth model (this may take a moment)...';

            const originalUrl = URL.createObjectURL(file);

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict-depth', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const depthBlob = await response.blob();
                const depthUrl = URL.createObjectURL(depthBlob);

                await buildTerrain(originalUrl, depthUrl);
            } catch (err) {
                status.textContent = 'Error: ' + err.message + ' (is the backend server running?)';
                console.error(err);
            }
        });
    </script>
</body>
</html>
